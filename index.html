<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FreeChat — Converse com alguém novo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">FreeChat</a>
  <nav>
    <a href="online.html">🟢 Online</a>
    <a href="messages.html">📬 Mensagens</a>
    <a href="profile.html">👤 Perfil</a>
  </nav>
</header>

<main class="hero">
  <section class="hero-card">
    <span class="eyebrow">CONHEÇA ALGUÉM NOVO</span>
    <h1>Converse com alguém que você ainda não conhece.</h1>
    <p>Encontre uma pessoa aleatória ou escolha alguém que esteja online e disponível.</p>

    <div class="actions">
      <button class="primary" id="randomBtn" type="button">🔀 Encontrar alguém</button>
      <a class="button secondary" href="online.html">🟢 Ver quem está online</a>
      <a class="button secondary" href="profile.html">👤 Criar / editar perfil</a>
    </div>

    <div class="features">
      <span>🌍 Pessoas novas</span>
      <span>💬 Tempo real</span>
      <span>🔒 Privacidade</span>
      <span>📬 Mensagens salvas</span>
    </div>
  </section>
</main>

<script type="module">
  import { ensureSession, getProfile } from "./js/auth.js";

  document.querySelector("#randomBtn").addEventListener("click", async () => {
    const button = document.querySelector("#randomBtn");
    button.disabled = true;
    button.textContent = "A verificar...";

    try {
      const session = await ensureSession();
      if (!session) return;

      const profile = await getProfile(session.user.id);
      if (!profile?.nickname) {
        location.href = "profile.html?setup=1";
        return;
      }

      location.href = "match.html";
    } finally {
      button.disabled = false;
      button.textContent = "🔀 Encontrar alguém";
    }
  });
</script>
</body>
</html>
