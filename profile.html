<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Perfil — FreeChat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">FreeChat</a>
  <nav>
    <a href="online.html">🟢 Online</a>
    <a href="messages.html">📬 Mensagens</a>
    <a href="profile.html">👤 Perfil</a>
  </nav>
</header>

<main class="page narrow">
  <div class="card">
    <span class="eyebrow" id="eyebrow">MEU PERFIL</span>
    <h1 id="title">Crie seu perfil</h1>
    <p id="intro">Escolha um apelido. Depois de salvar, você poderá encontrar alguém para conversar.</p>

    <label>
      Apelido
      <input id="nickname" maxlength="30" autocomplete="nickname" placeholder="Ex.: LuaAzul">
    </label>

    <label class="switch">
      <input id="available" type="checkbox">
      <span>🟢 Estou disponível para conversar</span>
    </label>

    <button id="save" type="button" class="primary">💾 Salvar perfil</button>
    <p id="result" class="notice" aria-live="polite"></p>

    <div id="nextActions" hidden style="margin-top:24px">
      <div style="border-top:1px solid #e5e7ef;padding-top:22px">
        <strong>Perfil pronto! O que você quer fazer?</strong>
        <div class="actions" style="justify-content:flex-start;margin:16px 0 0">
          <a class="button primary" href="match.html">🔀 Encontrar alguém</a>
          <a class="button secondary" href="online.html">🟢 Pessoas online</a>
          <a class="button secondary" href="messages.html">📬 Minhas mensagens</a>
          <a class="button secondary" href="index.html">← Início</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="js/profile.js"></script>
</body>
</html>
